name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Syntax, temporal dead zone, worker routing, and one build marker everywhere.
      - run: node scripts/check.mjs

      - run: npm test
        working-directory: calendar-worker
